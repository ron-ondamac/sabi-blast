version: '3.9'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blast_design
    ports:
      - '5432:5432'
    volumes:
      - blast_db_data:/var/lib/postgresql/data
volumes:
  blast_db_data:
